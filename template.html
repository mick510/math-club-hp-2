<!DOCTYPE html>

<html>
    <head>
        <!--name of web page on the tab-->
        <title>SUO Math Club - Template</title>
        <!--all the js stuff linked-->
        <script src="scripts/nav.js" defer></script>
        <!--all the css stuff linked-->
        <link rel="stylesheet" href="styles/general.css">
        <link rel="stylesheet" href="styles/nav.css">
        <link rel="stylesheet" href="styles/footer.css">
    </head>

    <body>
        <header>
            <!--header when window is big-->
            <nav class="big-nav">
                <!--logo on header-->
                <img src="images/elementor-placeholder-image.png" class="header-image">

                <a href="...">Events</a>

                <!--resources options, dropdown-->
                <div class="menu-options-container">
                    <a href="...">Resources</a>
                    <div class="menu-options"> <!--hover to see-->
                        <a href="...">MATH courses</a>
                        <a href="...">STAT courses</a>
                        <a href="...">Blog</a>
                        <a href="...">Other</a>
                    </div>
                </div>
                
                <a href="...">Merch</a>

                <a href="...">Contact</a>

                <a href="...">Login</a>
            </nav>

            <!--header when window is small-->
            <div class="small-header">
                <!--logo on header-->
                <img src="images/elementor-placeholder-image.png" class="horizontal-header-image">
                <!--three lines to open side nav-->
                <button class="open-side-nav">
                    <img src="images/elementor-placeholder-image.png" class="header-image">
                </button>
            </div>
        </header>

        <nav class="small-nav">
            <a href="...">Events</a>

            <!--resources options, dropdown-->
            
            <button class="button-menu-options">
                Resources
                <img src="images/elementor-placeholder-image.png" class="triangle">
            </button>
            <div class="side-nav-menu-options"> <!--click to see-->
                <a href="...">All</a>
                <a href="...">MATH courses</a>
                <a href="...">STAT courses</a>
                <a href="...">Blog</a>
                <a href="...">Other</a>
            </div>

            <a href="...">Merch</a>

            <a href="...">Contact</a>

            <a href="...">Login</a>
        </nav>

        <main>
            <!--just something to split the header and footer, replace with content-->
            <img src="images/elementor-placeholder-image.png" class="placeholder">
        </main>
        
        <footer>
            <div class="big-footer">
                <img src="images/elementor-placeholder-image.png" class="footer-image">
                
                <div class="updates">
                    <a href="..." class="footer-title">Updates</a>
                    <a href="..." class="update">Title of the update</a>
                </div>

                <div class="social-media-list-container">
                    <p>Find us on</p>
                    <div class="social-media-list">
                        <!--discord, rubric, instagram, email (?)-->
                        <a href="..." class="social-media">
                            <img src="images/elementor-placeholder-image.png" class="social-media-image">
                        </a>

                        <a href="..." class="social-media">
                            <img src="images/elementor-placeholder-image.png" class="social-media-image">
                        </a>

                        <a href="..." class="social-media">
                            <img src="images/elementor-placeholder-image.png" class="social-media-image">
                        </a>

                        <a href="..." class="social-media">
                            <img src="images/elementor-placeholder-image.png" class="social-media-image">
                        </a>
                    </div>
                    <a href="..." class="contact">Or Contact Us</a>
                </div>
            </div>

            <div class="small-footer">
                <img src="images/elementor-placeholder-image.png" class="horizontal-footer-logo">
                <a href="..." class="footer-contact">Contact Us</a>
            </div>
        </footer>
    </body>
</html>
